name: Build (CI)

permissions:
  contents: read

on:
  push:
    branches: [dev]
    paths-ignore: &ignored
      - '**/.editorconfig'
      - '**/.gitignore'
      - '**/.gitattributes'
      - '**/*.md'
      - '**/LICENSE'
      - '**/LICENCE'
      - 'PCL.Core.Test/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - configuration: CI
            architecture: x64
          - configuration: CI
            architecture: ARM64
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      architecture: ${{ matrix.architecture }}
    secrets: inherit

  release:
    name: Auto Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          version=$(grep -oP '<AssemblyVersion>\K[^<]+' "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" | head -1 || echo "0.0.0.0")
          sha=$(git rev-parse --short HEAD)
          run=$GITHUB_RUN_NUMBER
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-${run}-${sha}-Restore" >> "$GITHUB_OUTPUT"

      - name: Download x64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: PCL2_CE_CI_x64
          path: ./release/x64

      - name: Download ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: PCL2_CE_CI_ARM64
          path: ./release/arm64

      - name: Rename Binaries
        shell: bash
        run: |
          mkdir -p ./final
          mv ./release/x64/Plain Craft Launcher 2.exe ./final/PCL2_CE_x64_${{ steps.ver.outputs.version }}.exe
          mv ./release/arm64/Plain Craft Launcher 2.exe ./final/PCL2_CE_ARM64_${{ steps.ver.outputs.version }}.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Restore ${{ steps.ver.outputs.tag }}"
          body: |
            Automatic release from restored commit `${{ github.sha }}`.
            - Version: ${{ steps.ver.outputs.version }}
            - Build: #${{ github.run_number }}
          files: ./final/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
